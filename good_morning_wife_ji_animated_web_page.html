<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Good Morning Wife Ji – Royal Purple</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Great+Vibes&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      height: 100vh;
      background: radial-gradient(circle at top, #4b1d6b, #1a0626, #000);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      color: #e9d5ff;
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: url('https://www.transparenttextures.com/patterns/diamond-upholstery.png');
      opacity: 0.12;
    }

    .container {
      position: relative;
      text-align: center;
      padding: 55px 75px;
      border: 3px solid rgba(196,146,255,.6);
      border-radius: 24px;
      background: linear-gradient(145deg, rgba(168,85,247,.15), rgba(0,0,0,.65));
      box-shadow: 0 0 70px rgba(168,85,247,.5);
      z-index: 2;
      animation: fadeIn 3s ease;
    }

    .crown { font-size: 3rem; margin-bottom: 10px; animation: glow 2s infinite alternate; }

    h1 {
      font-family: 'Great Vibes', cursive;
      font-size: 4.2rem;
      color: #e9d5ff;
    }

    h2 {
      font-family: 'Playfair Display', serif;
      font-size: 2.3rem;
      letter-spacing: 2px;
      color: #d8b4fe;
    }

    .name {
      display: inline-block;
      font-family: 'Great Vibes', cursive;
      font-size: 3.2rem;
      color: #e9d5ff;
      margin-top: 10px;
      cursor: pointer;
      animation: nameGlow 3s infinite;
    }

    .name.active {
      transform: scale(1.25);
      animation: auraPulse 1.2s ease;
      text-shadow:
        0 0 20px #d8b4fe,
        0 0 40px #c084fc,
        0 0 80px #a855f7,
        0 0 120px rgba(168,85,247,.9);
    }

    .subtitle { margin-top: 15px; font-style: italic; color: #c4b5fd; }

    .sun {
      position: absolute;
      width: 190px;
      height: 190px;
      border-radius: 50%;
      background: radial-gradient(circle, #e9d5ff, #c084fc, #b45309);
      left: 50%;
      transform: translateX(-50%);
      top: 75%;
      animation: sunrise 8s infinite alternate;
      box-shadow: 0 0 90px rgba(192,132,252,.9);
    }

    .heart, .burst-heart {
      position: absolute;
      width: 20px;
      height: 20px;
      background: linear-gradient(45deg, #c084fc, #7e22ce);
      transform: rotate(45deg);
    }

    .heart {
      bottom: -20px;
      animation: floatUp 7s infinite;
      box-shadow: 0 0 14px rgba(192,132,252,1);
    }

    .burst-heart { animation: burst 1.2s ease forwards; }

    .heart::before, .heart::after,
    .burst-heart::before, .burst-heart::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: inherit;
    }

    .heart::before, .burst-heart::before { top: -10px; }
    .heart::after, .burst-heart::after { left: -10px; }

    .petal {
      position: absolute;
      top: -30px;
      width: 16px;
      height: 22px;
      background: linear-gradient(to bottom, #e9d5ff, #7e22ce);
      border-radius: 50%;
      animation: fall 10s linear infinite;
    }

    @keyframes sunrise { from { top: 85%; } to { top: 20%; } }
    @keyframes floatUp { to { transform: translateY(-950px) rotate(45deg); opacity: 0; } }
    @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }
    @keyframes fadeIn { from { opacity: 0; transform: scale(.85); } }
    @keyframes glow { to { text-shadow: 0 0 28px #e9d5ff; } }
    @keyframes nameGlow { 50% { text-shadow: 0 0 30px #e9d5ff; } }
    @keyframes auraPulse { 50% { filter: drop-shadow(0 0 35px #e9d5ff); } }
    @keyframes burst { to { transform: translate(var(--x),var(--y)) rotate(45deg); opacity: 0; } }
  </style>
</head>
<body>

<audio autoplay loop>
  <source src="https://cdn.pixabay.com/audio/2022/03/15/audio_7c3f2c1a64.mp3" type="audio/mpeg">
</audio>

<div class="sun"></div>

<div class="container">
  <div class="crown">👑</div>
  <h1>Good Morning</h1>
  <h2>My Queen</h2>
  <div class="name">Diyaa Ji 💜</div>
  <div class="subtitle">May your day bloom with royal love and grace</div>
</div>

<script>
  const nameEl = document.querySelector('.name');

  function floating(cls, interval, duration) {
    setInterval(() => {
      const el = document.createElement('div');
      el.className = cls;
      el.style.left = Math.random()*100 + 'vw';
      document.body.appendChild(el);
      setTimeout(()=>el.remove(), duration);
    }, interval);
  }

  floating('heart',600,8000);
  floating('petal',500,10000);

  nameEl.addEventListener('click', () => {
    nameEl.classList.add('active');
    const r = nameEl.getBoundingClientRect();
    for(let i=0;i<14;i++){
      const b=document.createElement('div');
      b.className='burst-heart';
      const a=Math.random()*Math.PI*2,d=Math.random()*80+40;
      b.style.left=r.left+r.width/2+'px';
      b.style.top=r.top+r.height/2+'px';
      b.style.setProperty('--x',Math.cos(a)*d+'px');
      b.style.setProperty('--y',Math.sin(a)*d+'px');
      document.body.appendChild(b);
      setTimeout(()=>b.remove(),1200);
    }
    setTimeout(()=>nameEl.classList.remove('active'),1200);
  });
</script>
</body>
</html>
